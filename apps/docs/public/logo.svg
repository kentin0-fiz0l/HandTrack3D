<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#646cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#535bf2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hand outline -->
  <g fill="url(#grad)">
    <!-- Palm -->
    <path d="M 30 60 Q 30 70 35 75 L 60 75 Q 65 70 65 60 L 65 45 L 30 45 Z" />

    <!-- Thumb -->
    <path d="M 30 50 L 25 45 Q 20 40 20 35 Q 20 30 25 28 Q 30 26 32 30 L 35 40 Z" />

    <!-- Index finger -->
    <path d="M 35 45 L 35 20 Q 35 15 40 15 Q 45 15 45 20 L 45 45 Z" />

    <!-- Middle finger -->
    <path d="M 45 45 L 45 15 Q 45 10 50 10 Q 55 10 55 15 L 55 45 Z" />

    <!-- Ring finger -->
    <path d="M 55 45 L 55 20 Q 55 15 60 15 Q 65 15 65 20 L 65 45 Z" />

    <!-- Pinky -->
    <path d="M 65 45 L 65 25 Q 65 20 70 20 Q 75 20 75 25 L 75 45 L 70 50 Z" />
  </g>

  <!-- 3D accent -->
  <circle cx="50" cy="50" r="3" fill="#fff" opacity="0.5"/>
  <circle cx="40" cy="35" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="60" cy="35" r="2" fill="#fff" opacity="0.5"/>
</svg>
