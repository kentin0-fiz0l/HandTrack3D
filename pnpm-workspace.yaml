packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'

allowBuilds:
  core-js: set this to true or false
  esbuild: true

minimumReleaseAgeExclude:
  - '@handtrack3d/core@0.2.0-alpha.0 || 0.2.0-alpha.2'
  - '@handtrack3d/react@0.2.0-alpha.1 || 0.2.0-alpha.2'
  - '@handtrack3d/three@0.2.0-alpha.1 || 0.2.0-alpha.2'
